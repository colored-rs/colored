name: Run tests
on: pull_request
env:
  CLICOLOR_FORCE: 1
  COLORTERM: "truecolor"

jobs:
  cargo-fmt:
    name: cargo-fmt@stable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      - name: Run formatting checks
        run: cargo fmt --check

  cargo-clippy:
    name: "${{ matrix.os }}:cargo-clippy@stable"
    runs-on: "${{ matrix.os }}-latest"
    strategy:
      matrix:
        os: ["ubuntu", "windows", "macos"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - name: Run clippy checks
        run: cargo clippy --all-features -- -D warnings

  cargo-test:
    name: "${{ matrix.os }}:cargo-test@${{ matrix.version }}"
    runs-on: "${{ matrix.os }}-latest"
    strategy:
      matrix:
        os: ["ubuntu", "windows", "macos"]
        version: ["stable", "beta", "1.80"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # Resolve against package.rust-version with modern Cargo, then compile with the MSRV.
      - name: Install Cargo with MSRV-aware resolution
        if: matrix.version == '1.80'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Resolve MSRV-compatible test dependencies
        if: matrix.version == '1.80'
        run: cargo +stable generate-lockfile
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
      - name: Install Rust ${{ matrix.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.version }}
      - name: Run tests
        run: cargo test

  check-semver:
    name: Check semver compatibility
    if: github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check semver
        uses: obi1kenobi/cargo-semver-checks-action@v2

  loom:
    name: Loom override model
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Check override interleavings
        run: cargo test --lib control::loom_tests --release
        env:
          RUSTFLAGS: --cfg loom
